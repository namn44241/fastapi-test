services:
  postgres_keycloak:
    container_name: postgres_keycloak
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    ports:
      - "${KC_DB_PORT:-17542}:5432"
    networks:
      - sign_base
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_prepared_transactions=100"

  keycloak:
    container_name: keycloak_sign_base
    image: quay.io/keycloak/keycloak:latest
    depends_on:
      - postgres_keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER:-postgres}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-postgres}

      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    networks:
      - sign_base
    restart: unless-stopped
    command:
      - start-dev

networks:
  sign_base:
    driver: bridge

volumes:
  keycloak_pgdata: